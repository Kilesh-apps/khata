actions.ocrDownload=async()=>{toast('Downloading the bill reader (about 7 MB)…');try{await loadOCR();toast('Bill reader is ready. It now works offline.');if(view==='settings') renderSettings()}catch(e){OCRW=null;toast(await ocrProblem(e))}};

/* ================= hide amounts: PIN / biometric gate ================= */
function guard(){return S.set.guard||(S.set.guard={mode:'off'})}
function guardSummary(){const g=guard();if(g.mode==='bio') return 'Fingerprint or face, with your PIN as backup';if(g.mode==='pin') return meta.locked?'Your app PIN':'A PIN just for this';return 'Anyone holding the phone can tap the eye'}
const bioSupported=async()=>{try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch{return false}};
async function pinHash(pin,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,256)))}
async function checkGuardPin(pin){
  const g=guard();
  if(meta.locked){try{const key=await deriveKey(pin,unb64(meta.salt));await decrypt(key,JSON.parse(localStorage.getItem(K_ENC)));return true}catch{return false}}
  if(!g.pinHash) return false;return (await pinHash(pin,unb64(g.pinSalt)))===g.pinHash;
}
async function bioRegister(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Khata',id:location.hostname},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'khata-amounts',displayName:'Khata'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  return b64(new Uint8Array(cred.rawId));
}
async function bioCheck(){
  const g=guard();if(!g.credId) return false;
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64(g.credId)}],userVerification:'required',timeout:60000}});
  return !!(a&&a.response&&a.response.authenticatorData&&(new Uint8Array(a.response.authenticatorData)[32]&0x04));
}
async function setGuardMode(mode){
  const g=guard(),back=()=>{if(view==='settings') renderSettings()};
  if(mode==='off'){
    if(g.mode!=='off'&&!(await askGuard('Turn off the check'))){back();return}
    S.set.guard={mode:'off'};persist();back();toast('Amounts show with a tap again.');return}
  if(!window.crypto||!crypto.subtle){toast('This needs the app opened over https.');back();return}
  if(!meta.locked&&!g.pinHash){const ok=await setGuardPin();if(!ok){back();return}}
  if(mode==='bio'){
    if(!(await bioSupported())){toast('This phone has no fingerprint or face unlock the browser can use. Using PIN instead.');mode='pin'}
    else{try{g.credId=await bioRegister()}catch(e){toast(e&&e.name==='NotAllowedError'?'Fingerprint setup was cancelled.':'Couldn\u2019t set up fingerprint: '+(e.message||e.name));back();return}}
  }
  g.mode=mode;S.set.hide=true;persist();back();render();toast(mode==='bio'?'Amounts now need your fingerprint or face.':'Amounts now need your PIN.');
}
function setGuardPin(){return new Promise(res=>{
  sheet(`<h2>Set a PIN for amounts</h2><p class="help">You'll type this to show amounts, or as a backup when fingerprint doesn\u2019t work. It only hides numbers on screen; to encrypt your data too, use PIN lock instead.</p>
  <label>PIN<input id="g-p1" type="password" inputmode="numeric" autocomplete="new-password"></label><label>Again<input id="g-p2" type="password" inputmode="numeric" autocomplete="new-password"></label>
  <p class="danger small" id="g-err"></p><div class="btns"><button class="btn" data-act="gCancel">Cancel</button><button class="btn primary grow" data-act="gSave">Save PIN</button></div>`,p=>p.querySelector('input').focus());
  actions.gCancel=()=>{actions.close();res(false)};
  actions.gSave=async()=>{const a=$('#g-p1').value,b=$('#g-p2').value,err=$('#g-err');
    if(a.length<4){err.textContent='Use at least 4 digits.';return}if(a!==b){err.textContent='The two entries don\u2019t match.';return}
    const salt=crypto.getRandomValues(new Uint8Array(16));Object.assign(guard(),{pinSalt:b64(salt),pinHash:await pinHash(a,salt)});persist();actions.close();res(true)};
})}
function askGuard(title){return new Promise(async res=>{
  const g=guard();let done=false;const finish=v=>{if(done) return;done=true;actions.close();res(v)};
  const canBio=g.mode==='bio'&&g.credId&&await bioSupported(),hasPin=meta.locked||!!g.pinHash;
  sheet(`<h2>${esc(title)}</h2>${canBio?'<div class="btns"><button class="btn primary grow" data-act="gBio">Use fingerprint or face</button></div>':''}
  ${hasPin?`<label>${meta.locked?'App PIN':'PIN'}<input id="g-pin" type="password" inputmode="numeric" autocomplete="current-password"></label><p class="danger small" id="g-err"></p>
  <div class="btns"><button class="btn" data-act="gNo">Cancel</button><button class="btn ${canBio?'':'primary '}grow" data-act="gPin">Show with PIN</button></div>`:'<div class="btns"><button class="btn grow" data-act="gNo">Cancel</button></div>'}`,
  p=>{const i=p.querySelector('#g-pin');if(i){i.addEventListener('keydown',e=>{if(e.key==='Enter') actions.gPin()});if(!canBio) i.focus()}});
  actions.gNo=()=>finish(false);
  actions.gBio=async()=>{try{if(await bioCheck()) finish(true);else toast('Not recognised. Try again or use your PIN.')}catch(e){if(e&&e.name!=='NotAllowedError') toast('Fingerprint isn\u2019t available right now. Use your PIN.')}};
  actions.gPin=async()=>{const v=$('#g-pin').value;if(!v) return;$('#g-err').textContent='Checking…';if(await checkGuardPin(v)) finish(true);else{$('#g-err').textContent='Wrong PIN.';$('#g-pin').select()}};
  if(canBio) setTimeout(()=>actions.gBio(),250);
})}
async function revealAmounts(){
  const g=guard();
  if(g.mode==='off'){S.set.hide=false;render();return}
  if(await askGuard('Show amounts')){S.set.hide=false;render();toast('Amounts shown until you leave the app.')}
}

/* ================= fingerprint unlock (WebAuthn PRF wraps the PIN) =================
   The fingerprint check returns a secret that only this phone's authenticator can produce (PRF extension).
   That secret encrypts a copy of your PIN; unlocking decrypts the PIN and then opens the data as usual. */
async function prfKey(out){const base=await crypto.subtle.importKey('raw',out,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new TextEncoder().encode('khata-unlock'),info:new Uint8Array()},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function prfGet(credId,salt){
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
    allowCredentials:[{type:'public-key',id:unb64(credId)}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
  const r=a.getClientExtensionResults&&a.getClientExtensionResults().prf;
  if(!r||!r.results||!r.results.first) throw new Error('nprf');
  return new Uint8Array(r.results.first);
}
function askAppPin(title){return new Promise(res=>{
  sheet(`<h2>${esc(title)}</h2><p class="help">Type your app PIN once so Khata can link it to your fingerprint.</p><label>App PIN<input id="b-pin" type="password" inputmode="${meta.numeric?'numeric':'text'}" autocomplete="current-password"></label><p class="danger small" id="b-err"></p>
  <div class="btns"><button class="btn" data-act="bNo">Cancel</button><button class="btn primary grow" data-act="bGo">Continue</button></div>`,p=>p.querySelector('input').focus());
  actions.bNo=()=>{actions.close();res(null)};
  actions.bGo=async()=>{const v=$('#b-pin').value;if(!v) return;$('#b-err').textContent='Checking…';
    try{const key=await deriveKey(v,unb64(meta.salt));await decrypt(key,JSON.parse(localStorage.getItem(K_ENC)));actions.close();res(v)}catch{$('#b-err').textContent='Wrong PIN.';$('#b-pin').select()}};
})}
async function bioUnlockSetup(){
  const back=()=>{if(view==='settings') renderSettings()};
  if(!(await bioSupported())){toast('This phone has no fingerprint or face unlock the browser can use.');back();return}
  const pin=await askAppPin('Turn on fingerprint unlock');if(!pin){back();return}
  try{
    const salt=crypto.getRandomValues(new Uint8Array(32));
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Khata',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'khata-unlock',displayName:'Khata unlock'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none',extensions:{prf:{eval:{first:salt}}}}});
    const ext=cred.getClientExtensionResults&&cred.getClientExtensionResults().prf;
    if(!ext||ext.enabled===false){toast('Your phone\u2019s browser can\u2019t do fingerprint unlock yet. Your PIN still works.');back();return}
    const credId=b64(new Uint8Array(cred.rawId));
    let out=ext.results&&ext.results.first?new Uint8Array(ext.results.first):null;
    if(!out){toast('Touch the sensor once more to finish.');out=await prfGet(credId,salt)}
    const enc=await encrypt(await prfKey(out),{pin});
    meta.bio={credId,salt:b64(salt),iv:enc.iv,ct:enc.ct};localStorage.setItem(K_META,JSON.stringify(meta));
    back();toast('Fingerprint unlock is on.');
  }catch(e){toast(e&&e.name==='NotAllowedError'?'Fingerprint setup was cancelled.':e&&e.message==='nprf'?'Your phone\u2019s browser can\u2019t do fingerprint unlock yet. Your PIN still works.':'Couldn\u2019t set up fingerprint unlock: '+((e&&e.message)||'error'));back()}
}
function bioUnlockOff(){delete meta.bio;localStorage.setItem(K_META,JSON.stringify(meta));if(view==='settings') renderSettings();toast('Fingerprint unlock is off. Use your PIN.')}
let bioBusy=false;
actions.bioUnlock=async()=>{
  if(!meta.bio||bioBusy) return;bioBusy=true;$('#lock-err').textContent='';
  try{const out=await prfGet(meta.bio.credId,unb64(meta.bio.salt));const {pin}=await decrypt(await prfKey(out),meta.bio);$('#lock-in').value=pin;await actions.unlock()}
  catch(e){$('#lock-err').textContent=e&&e.name==='NotAllowedError'?'Fingerprint didn\u2019t unlock. Tap \u201cUse fingerprint\u201d to try again, or type your PIN.':'Fingerprint isn\u2019t working right now. Type your PIN.';setTimeout(()=>$('#lock-in').focus(),60)}
  finally{bioBusy=false}
};

boot();gcPhotos();
