<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111513">
<script>(()=>{const m=matchMedia("(prefers-color-scheme: dark)"),t=document.querySelector("meta[name=theme-color]"),f=()=>t.content=m.matches?"#111513":"#EDEFEB";f();m.addEventListener("change",f)})()</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Khata</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#EDEFEB;--surface:#FFFFFF;--key:#F8F9F6;--ink:#18201C;--muted:#5F6963;--line:#D5DAD3;--soft:#E3E8E1;
  --accent:#2F6B4F;--accent-soft:#DDEBE3;--danger:#B23A2E;--danger-soft:#F6E1DE;--warn:#93600F;--warn-soft:#F7ECD6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111513;--surface:#1B201D;--key:#1E2421;--ink:#E6EAE5;--muted:#9AA59D;--line:#2E3631;--soft:#262D29;
  --accent:#7DBE9C;--accent-soft:#1F3329;--danger:#EC8A7E;--danger-soft:#3A2220;--warn:#E0B05A;--warn-soft:#3A2F1A;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"SF Pro Text",Roboto,"Noto Sans","Noto Sans Devanagari","Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
body.veil main,body.veil #sheet{visibility:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
main{flex:1;overflow-y:auto}
.view{max-width:540px;margin:0 auto;padding:4px 16px 28px}
h1{font-size:22px;font-weight:650;margin:0;letter-spacing:-.01em}
h2{font-size:20px;font-weight:650;margin:0 0 4px}
h3{font-size:16px;font-weight:600;margin:0 0 8px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.danger{color:var(--danger)}.warn{color:var(--warn)}.good{color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.icon:active{background:var(--soft)}
.icon svg{width:23px;height:23px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-top:12px}
.card>h3:first-child{margin-bottom:10px}

/* segmented */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:550;font-size:15px;color:var(--muted);text-align:center;padding:0 8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.top .seg{flex:1;max-width:330px;min-width:0}
.seg button{min-width:0}
@media (max-width:370px){.amount .cur{font-size:18px}.ghost{padding:0 9px;font-size:13px}.seg button{font-size:13.5px;padding:0 4px}.top .icon{width:38px}.view{padding-left:12px;padding-right:12px}.grid{gap:6px}.tile{font-size:12px;padding-left:2px;padding-right:2px}}

/* add */
.add{display:flex;flex-direction:column;min-height:100%;padding-bottom:26px}
.status{font-size:14px;margin-top:6px;padding:9px 12px;border-radius:10px;background:var(--surface);text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.danger{background:var(--danger-soft);color:var(--danger)}
.amount-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0}
.amount{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1;overflow:hidden}
.amount-row>div:last-child{flex:none}
.amount .num.long{font-size:clamp(30px,9.5vw,44px)}
.amount .num.xlong{font-size:clamp(24px,7.5vw,34px)}
.amount,.amount *,.r,.stat b,.big,.mini b{overflow-wrap:normal;word-break:normal;white-space:nowrap}
.kv>span:last-child{overflow-wrap:normal;word-break:normal}
.stat{min-width:0;overflow:hidden}.stat b{overflow:hidden;text-overflow:ellipsis}.stat b.s1{font-size:17px}.stat b.s2{font-size:15px}
.tile{overflow-wrap:normal;hyphens:auto;-webkit-hyphens:auto}.tile span{word-break:normal}
.amount .cur{font-size:22px;color:var(--muted);font-weight:500}
.amount .num{font-size:clamp(46px,14vw,64px);font-weight:350;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.amount .num.zero{color:var(--muted);opacity:.45}
.ghost{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:550;color:var(--ink);background:var(--surface);flex:none}
.note{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-size:15px;outline:none;margin-top:10px}
.note:focus{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{min-height:52px;border-radius:12px;background:var(--surface);border:1.5px solid transparent;padding:8px 6px 7px;font-size:13px;font-weight:500;line-height:1.2;
  display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.tile span{word-break:normal;overflow-wrap:break-word;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile i{width:22px;height:5px;border-radius:3px;flex:none}
.tile.on{border-color:var(--ink);background:var(--soft)}
.tile.more{color:var(--muted)}
.tile b{font-weight:650}
.selects{display:flex;gap:8px;margin-top:10px}
.sel{flex:1 1 0;min-width:0;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:0 10px;display:flex;flex-direction:column;justify-content:center;text-align:left}
.sel small{font-size:11px;color:var(--muted);line-height:1.1}
.sel span{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel.wide{flex:2 1 0}
.sel.active{border-color:var(--accent);background:var(--accent-soft)}
.sel.date input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
label.sel{cursor:text}
.sel input:not([type=date]){border:0;background:transparent;padding:0;font-size:14px;font-weight:550;width:100%;outline:none;height:20px;color:var(--ink)}
#add-fuel{margin-top:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:68px;height:68px}
.thumb>button:first-child{width:100%;height:100%;border-radius:10px;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:12px;text-align:center}
#viewer{position:fixed;inset:0;z-index:35}
#viewer .scrim{background:rgba(0,0,0,.85)}
.vbox{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;max-width:560px;margin:0 auto}
.vbox img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px;background:#fff;margin:0 auto;display:block}
.vcard{display:block;width:100%;text-align:left}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini b{display:block;font-size:17px;font-weight:600}
.mini small{font-size:12px;color:var(--muted)}
.clip{width:13px;height:13px;vertical-align:-1px;color:var(--muted)}
.ghost #ph-n:empty{display:none}
.sel.date{position:relative}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(40px,1fr);gap:7px;margin-top:auto;padding-top:8px;flex:1 1 auto;max-height:290px}
.keys button{height:auto;min-height:40px;font-size:24px;border-radius:12px;background:var(--key);text-align:center}
.keys button:active{background:var(--soft)}
.add.has-fuel .keys{gap:5px;padding-top:8px}.add.has-fuel .keys button{min-height:38px}.add.has-fuel .tile{min-height:46px;padding:6px 4px}.add.has-fuel .note{height:40px;margin-top:8px}.add.has-fuel .grid{margin-top:8px}
@media (max-height:800px){.add .top{min-height:50px}.amount-row{margin-top:6px}.amount .num{font-size:clamp(40px,12vw,52px)}.note{height:40px;margin-top:8px}.grid{margin-top:8px}.tile{min-height:46px;padding:6px 4px}
  .selects{margin-top:8px}.sel{height:44px}.keys{gap:5px;padding-top:8px}.keys button{min-height:40px}.save{height:50px;margin-top:6px}.status{padding:7px 12px;font-size:13.5px}}
@media (max-width:370px){.wide-only{display:none}}
@media (max-width:340px){.tile{font-size:11px;letter-spacing:-.01em}}
.keys .clear{font-size:15px;font-weight:600;color:var(--muted)}
.save{height:54px;border-radius:14px;background:var(--accent);color:#fff;font-weight:650;font-size:16px;margin-top:8px;width:100%;text-align:center}
@media (prefers-color-scheme:dark){.save{color:#0E1A14}}
.save.wait{background:var(--soft);color:var(--muted);opacity:1}

/* lists */
.lede{font-size:16px;margin:2px 0 4px;line-height:1.5}
.lede b{font-weight:650}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1;display:flex;gap:12px;align-items:center}
.row .l>div{min-width:0;flex:1}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);margin-top:1px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:16px 2px 6px;font-weight:550}
.bar-t{height:6px;background:var(--soft);border-radius:3px;margin-top:8px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar-t i.over{background:var(--danger)}.bar-t i.mid{background:var(--warn)}
.tools{display:flex;gap:8px;margin-top:12px}
.tools input,.tools select{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:15px}
.quick{display:flex;gap:6px;align-items:center;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qchip{height:34px;padding:0 13px;border-radius:17px;background:var(--surface);font-size:14px;font-weight:550;color:var(--muted);flex:none}
.qchip.on{background:var(--ink);color:var(--bg)}
.sortbtn{margin-left:auto;flex:none;font-size:14px;font-weight:550;color:var(--muted);height:34px;padding:0 4px;white-space:nowrap}
.siitem{padding:12px;margin-top:10px}.siitem input{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:15px;min-width:0}
.siname{flex:1}.siprice{width:96px;text-align:right}.x2{width:34px;flex:none;color:var(--muted)}
.opt.sm{height:34px;padding:0 10px;font-size:14px}
.more-row{gap:14px;padding:14px}.more-row b{display:block;font-weight:600}.more-row small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--accent)}.mi svg{width:22px;height:22px}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 4px;margin-top:10px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px 4px;border-radius:12px;min-width:0}
.ctile:active{background:var(--soft)}
.cic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c)}
@media (prefers-color-scheme:dark){.cic{color:color-mix(in srgb,var(--c) 60%,#fff);background:color-mix(in srgb,var(--c) 26%,transparent)}}
.cic svg{width:22px;height:22px}
.cic.sm{width:34px;height:34px}.cic.sm svg{width:18px;height:18px}
.ctile.on .cic{background:var(--c);color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.cl{font-size:12px;line-height:1.2;text-align:center;max-width:100%;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
@media (max-width:370px){.cl{font-size:11px;letter-spacing:-.01em}.cic{width:36px;height:36px}}
.ctile.on .cl{color:var(--ink);font-weight:650}
.ctile.more .cic{--c:#8a948d}
.quickrow{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.quickrow::-webkit-scrollbar{display:none}
.quickrow .qchip{border:1px dashed var(--line);background:transparent;color:var(--ink)}.quickrow .qchip b{margin-left:6px;font-weight:650}
.catrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.catrow input[data-cn]{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:15px}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px;justify-items:center}
.icongrid .cic{width:44px;height:44px}.cic.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.swatch{width:34px;height:34px;border-radius:50%}.swatch.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex:none;margin:0!important}
.switch input{position:absolute!important;inset:0;opacity:0;margin:0!important;width:100%!important;height:100%!important;z-index:1;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .2s}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i:after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.srow>span:first-child{min-width:0}.srow small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ssel{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:14px;max-width:55%}
.flabel{display:block;font-size:13px;color:var(--muted);margin-top:12px;font-weight:500}
.flabel input,.flabel select{display:block;width:100%;margin-top:5px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.cday{position:relative;aspect-ratio:1/1.08;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;
  background:color-mix(in srgb,var(--accent) calc(var(--lvl)*62%),var(--soft))}
.cday.over{background:color-mix(in srgb,var(--danger) calc(25% + var(--lvl)*40%),var(--soft))}
.cday .dn{font-size:13px;font-weight:600;line-height:1}.cday .da{font-size:10px;line-height:1;opacity:.9;white-space:nowrap;overflow:hidden;max-width:100%}
.cday.fut{opacity:.4}.cday.today{box-shadow:inset 0 0 0 2px var(--ink)}.cday.sel{outline:2px solid var(--accent);outline-offset:1px}
.cday .inc{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#C2912E}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.tbtn{height:44px;flex:none;padding:0 14px}.tbtn.on{border-color:var(--accent);color:var(--accent)}
.filter{display:inline-flex;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;align-items:center;gap:8px;margin-top:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:550}
.empty{padding:28px 8px;color:var(--muted);text-align:center;line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:550;font-size:15px;text-align:center}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){.btn.primary{color:#0E1A14}}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1}
.btn.full{width:100%}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:8px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:20px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--accent-soft);color:var(--accent)}.pill.danger{background:var(--danger-soft);color:var(--danger)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;height:44px}

/* charts */
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut{flex:none;width:140px;height:140px}
@media (max-width:370px){.donut{width:112px;height:112px}.donut-wrap{gap:10px}}
.legend button span:last-child{flex:none}
.legend{flex:1;min-width:0}
.legend button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 0;font-size:14px}
.legend button span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:10px;fill:var(--muted)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.key{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.key span{display:inline-flex;align-items:center;gap:6px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:4px;background:var(--soft)}
.stack i{display:block;height:100%}
.gbar{display:grid;grid-template-columns:84px 1fr 92px;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.gbar .track{position:relative;height:12px}
.gbar .track:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.gbar .track i{position:absolute;top:0;height:12px;border-radius:3px}
.gbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tabs */
.tabs{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:5}
.tabs button{flex:1;min-width:0;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:550;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .fab{flex:0 0 76px;position:relative;justify-content:flex-start}

.savehint{display:block;width:100%;margin-top:6px;height:22px;line-height:22px;text-align:center;font-size:14px;font-weight:650;color:var(--accent)}.savehint.wait{color:var(--muted);font-weight:500}
.srow .btn{white-space:nowrap;flex:none;height:40px}
.fab span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 6px var(--bg),0 4px 14px rgba(0,0,0,.28);transition:transform .15s}
@media (prefers-color-scheme:dark){.fab span{color:#0E1A14}}
.fab svg{width:28px;height:28px}
.fab:active span{transform:translateX(-50%) scale(.93)}
.fab span{transition:transform .18s,background .2s,color .2s,box-shadow .2s}
.fab.wait span{background:var(--surface);color:var(--muted);box-shadow:0 0 0 6px var(--bg),inset 0 0 0 2px var(--line)}
.fab.pop span{animation:fabpop .32s ease-out}
@keyframes fabpop{0%{transform:translateX(-50%) scale(.85)}60%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.fab.pop span{animation:none}}
main{padding-bottom:22px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.grab{position:sticky;top:-10px;margin:-10px -16px 2px;padding:12px 0 14px;background:var(--bg);z-index:3;touch-action:none;cursor:grab;border-radius:20px 20px 0 0}
.grab:after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.55;margin:0 auto}
.panel.dragging{transition:none}.panel.settle{transition:transform .22s ease-out}
.scrim{transition:opacity .2s}
.panel label{display:block;font-size:13px;color:var(--muted);margin-top:14px;font-weight:500}
.panel label input,.panel label select,.panel label textarea{display:block;width:100%;margin-top:5px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px;color:var(--ink);font-weight:400}
.panel label textarea{height:120px;padding:12px 14px;resize:vertical}
.panel label small{display:block;margin-top:5px;font-size:12px;font-weight:400}
.panel .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.panel label.opt{display:inline-flex;margin-top:0;font-size:15px;color:var(--ink)}
.opt input,.panel label.opt input,.panel .opt input{display:inline-block;width:18px;height:18px;margin:0;padding:0;accent-color:var(--accent)}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 14px;border-radius:12px;background:var(--surface);margin-top:8px;border:1.5px solid transparent;text-align:left}
.pick.on{border-color:var(--accent)}
.pick small{display:block;font-size:12px;color:var(--muted)}
.big{font-size:34px;font-weight:350;letter-spacing:-.02em;margin:6px 0 2px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--muted);min-width:0}
.kv>span:last-child{text-align:right;flex:none;max-width:62%}
.kv{gap:12px}
.help{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin-top:16px}

#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:24px}
#lock .in{max-width:360px;width:100%;margin:0 auto}
#lock h2{font-size:28px;font-weight:400;margin-bottom:18px}
#lock input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 16px;font-size:22px;letter-spacing:.2em}
#lock-err{min-height:22px;margin:8px 0;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;display:flex;gap:16px;align-items:center;z-index:30;width:max-content;max-width:calc(100% - 32px)}
#toast button{color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:3px}
#toast .tx{text-decoration:none;opacity:.7;padding:0 2px 0 4px;font-weight:400}
#toast{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style>

<script src="xlsx.js"></script>
<script>
'use strict';
/* ================= constants ================= */
const K_PLAIN='khata.data',K_ENC='khata.enc',K_META='khata.meta';
const KINDS={bank:'Bank account',wallet:'Wallet (eSewa, Khalti…)',cash:'Cash',credit:'Credit card',vcc:'Fonepay credit card',prepaid:'Prepaid or dollar card'};
const METHODS={qr:'QR',card:'Card',online:'Online',cash:'Cash',bank:'Bank transfer',atm:'ATM',friend:'Paid by friend'};
const DEF_METHOD={cash:'cash',credit:'card',vcc:'qr',bank:'qr',wallet:'qr',prepaid:'online'};
const PAL=['#2F6B4F','#3B6EA5','#C2912E','#8E5A9B','#4E9A9A','#B4553F','#6B8E23','#A0526D','#5C6B7A','#D08A2E','#7A8B3C','#3F7F6E','#9B6B3A','#55779B','#8A6F9E','#6E8B74'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SEED=[['food','Food & drinks'],['groc','Groceries'],['trans','Transport'],['fuel','Fuel'],['rent','Rent'],['util','Bills & utilities'],['net','Phone & internet'],['shop','Shopping'],
 ['health','Health'],['family','Family'],['out','Going out'],['subs','Subscriptions'],['learn','Learning'],['give','Gifts & donations'],['fees','Fees & charges'],['other','Other']];
const SEED_INC=[['salary','Salary'],['side','Side income'],['refund','Refunds'],['gotgift','Gifts received'],['oinc','Other income']];

/* ================= state ================= */
let S=null,cryptoKey=null,meta=safeJSON(localStorage.getItem(K_META))||{};
let view='add',built=false;
let A=blankAdd('exp');
let H={day:null,off:0,mode:'overview',q:'',range:'period',from:'',to:'',sort:'new',f:{types:[],cats:[],accs:[],methods:[],min:'',max:'',photo:false,split:false}};
let G={open:null};

function safeJSON(s){try{return s?JSON.parse(s):null}catch{return null}}
function fresh(){return{v:2,accounts:[{id:'cash',name:'Cash',kind:'cash',open:0}],
  cats:SEED.map(([id,name],i)=>({id,name,kind:'exp',budget:0,color:PAL[i%PAL.length]})).concat(SEED_INC.map(([id,name],i)=>({id,name,kind:'inc',color:PAL[(i+3)%PAL.length]}))),
  tx:[],bills:[],quick:[],groups:[],gbills:[],gpays:[],vehicles:[],vlogs:[],
  set:{startDay:1,autolock:1,hide:false,hideOnOpen:false,lastBackup:null,lastAcc:{}}}}
function migrate(){
  const f=fresh();
  for(const k of ['accounts','cats','tx','bills','quick','groups','gbills','gpays','vehicles','vlogs']) if(!Array.isArray(S[k])) S[k]=f[k];
  S.set=Object.assign(f.set,S.set||{});if(!S.set.lastAcc) S.set.lastAcc={};
  S.cats.forEach((c,i)=>{if(!c.color) c.color=PAL[i%PAL.length]});
  if(S.set.hideOnOpen||(S.set.guard&&S.set.guard.mode!=='off')) S.set.hide=true;S.v=2;
}

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
const toP=v=>{const n=parseFloat(String(v??'').replace(/[,\s]/g,''));return isFinite(n)?Math.round(n*100):0};
function money(p,o={}){if(S&&S.set.hide&&o.hide!==false) return 'Rs\u00a0••••';return(p<0?'−':(o.sign&&p>0?'+':''))+'Rs\u00a0'+nf.format(Math.abs(p)/100)}
const short=p=>{if(S&&S.set.hide) return '••';const v=Math.abs(p)/100;return v>=1e5?(v/1e5).toFixed(v>=1e6?0:1).replace(/\.0$/,'')+'L':v>=1e3?(v/1e3).toFixed(v>=1e4?0:1).replace(/\.0$/,'')+'k':String(Math.round(v))};
const sz=t=>t.length>17?'s2':t.length>13?'s1':'';
const sum=(a,f=x=>x.amt)=>a.reduce((s,t)=>s+f(t),0);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ds(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
function mk(y,m,day){const f=new Date(y,m,1);const len=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();return ds(new Date(f.getFullYear(),f.getMonth(),Math.min(day,len)))}
const fmtD=s=>{const d=parseD(s);return d.getDate()+' '+MON[d.getMonth()]};
const fmtDay=s=>{const d=parseD(s);return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const ord=n=>n+((n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'));
const inDays=n=>n===0?'today':n===1?'tomorrow':n<0?(-n===1?'1 day ago':-n+' days ago'):'in '+n+' days';
const acc=id=>S.accounts.find(a=>a.id===id);
const cat=id=>S.cats.find(c=>c.id===id);
const grp=id=>S.groups.find(g=>g.id===id);
const isCredit=a=>!!a&&(a.kind==='credit'||a.kind==='vcc');
const activeAccs=()=>S.accounts.filter(a=>!a.archived);
const who=(g,id)=>id==='me'?'You':(g&&g.members.find(m=>m.id===id)||{}).name||'Someone';
const catColor=id=>(cat(id)||{}).color||'#888';

/* ================= money maths ================= */
function forEachFlow(fn,upTo){
  for(const t of S.tx){if(upTo&&t.date>upTo) continue;
    if(t.t==='exp') fn(t.acc,-t.amt); else if(t.t==='inc'||t.t==='adj') fn(t.acc,t.amt); else if(t.t==='xfer'){fn(t.acc,-t.amt);fn(t.to,t.amt)}}
  for(const b of S.gbills){if(upTo&&b.date>upTo) continue;if(b.payer==='me'&&b.acc) fn(b.acc,-b.total)}
  for(const x of S.gpays){if(upTo&&x.date>upTo) continue;if(x.from==='me'&&x.acc) fn(x.acc,-x.amt);if(x.to==='me'&&x.acc) fn(x.acc,x.amt)}
}
let BALC=null;
function balances(upTo){const key=upTo||'now';if(BALC&&BALC.has(key)) return {...BALC.get(key)};const b={};S.accounts.forEach(a=>b[a.id]=a.open||0);forEachFlow((id,d)=>{if(id in b) b[id]+=d},upTo);if(BALC) BALC.set(key,{...b});return b}
function period(off=0){
  const sd=Math.min(28,Math.max(1,S.set.startDay||1)),t=parseD(today());let y=t.getFullYear(),m=t.getMonth();
  if(t.getDate()<sd) m--;m+=off;
  const start=mk(y,m,sd),end=addDays(mk(y,m+1,sd),-1),s=parseD(start);
  return{start,end,label:sd===1?MONTH[s.getMonth()]+' '+s.getFullYear():fmtD(start)+' to '+fmtD(end),short:MON[s.getMonth()]};
}
const inP=(t,p)=>t.date>=p.start&&t.date<=p.end;
/* every entry, normalised: personal tx, split bills, group payments that involve you */
function items(p){
  const o=[];
  for(const t of S.tx) if(!p||inP(t,p)) o.push({k:'tx',id:t.id,date:t.date,ts:t.ts,t:t.t,amt:t.amt,share:t.t==='exp'?t.amt:0,cat:t.cat,acc:t.acc,to:t.to,method:t.method,note:t.note});
  for(const b of S.gbills) if(!p||inP(b,p)) o.push({k:'gb',id:b.id,date:b.date,ts:b.ts,t:'exp',amt:b.total,share:b.shares.me||0,cat:b.cat,acc:b.payer==='me'?b.acc:null,method:b.payer==='me'?b.method:'friend',note:b.note,group:b.group,payer:b.payer});
  for(const x of S.gpays) if((x.from==='me'||x.to==='me')&&(!p||inP(x,p))) o.push({k:'gp',id:x.id,date:x.date,ts:x.ts,t:'settle',amt:x.amt,share:0,acc:x.acc,from:x.from,to:x.to,group:x.group,method:x.method,note:x.note});
  return o;
}
const spends=p=>items(p).filter(i=>i.t==='exp'&&i.share>0);
function cardStatus(a){
  const bal=balances()[a.id]||0,owed=Math.max(0,-bal),limit=a.limit||0;
  const r={owed,limit,avail:limit?limit-owed:null};
  if(!a.stmtDay) return r;
  const td=today(),t=parseD(td),N=a.dueDays||15;let y=t.getFullYear(),m=t.getMonth();
  let last=mk(y,m,a.stmtDay);if(last>td){m--;last=mk(y,m,a.stmtDay)}
  const next=mk(y,m+1,a.stmtDay),due=addDays(last,N);
  const owedAt=Math.max(0,-(balances(last)[a.id]||0));
  const paid=S.tx.filter(x=>x.date>last&&((x.t==='xfer'&&x.to===a.id)||((x.t==='inc'||x.t==='adj')&&x.acc===a.id&&x.amt>0))).reduce((s,x)=>s+x.amt,0)
      +S.gpays.filter(x=>x.date>last&&x.to==='me'&&x.acc===a.id).reduce((s,x)=>s+x.amt,0);
  r.remaining=Math.max(0,owedAt-paid);
  r.unbilled=items().filter(x=>x.date>last&&x.acc===a.id&&x.t==='exp').reduce((s,x)=>s+x.amt,0);
  Object.assign(r,{last,next,due,daysToDue:diffDays(td,due)});
  r.overdue=r.remaining>0&&r.daysToDue<0;r.todayDue=addDays(next,N);r.todayDays=diffDays(td,r.todayDue);
  return r;
}
function billDue(b,p){const s=parseD(p.start);let d=mk(s.getFullYear(),s.getMonth(),b.day);if(d<p.start) d=mk(s.getFullYear(),s.getMonth()+1,b.day);return d}
const billPaid=(b,p)=>S.tx.some(t=>t.bill===b.id&&inP(t,p));
function alerts(){
  const out=[],td=today();
  for(const a of activeAccs()) if(isCredit(a)){const c=cardStatus(a);
    if(c.remaining>0&&c.daysToDue<=5) out.push({cls:c.overdue?'danger':'warn',text:`${a.name}: pay ${money(c.remaining)} ${c.overdue?'(overdue since '+fmtD(c.due)+')':'by '+fmtD(c.due)}`,go:'accounts'})}
  const p=period(0);
  for(const b of S.bills){if(billPaid(b,p)) continue;const n=diffDays(td,billDue(b,p));
    if(n<=3) out.push({cls:n<0?'danger':'warn',text:`${b.name}, ${money(b.amt)}, due ${inDays(n)}`,go:'plan'})}
  return out;
}
function usage(type,field){const c={};items().slice(-300).forEach((t,i)=>{if(t.t!==type) return;const k=t[field];if(k) c[k]=(c[k]||0)+1+i/300});return c}
const byUse=(list,counts)=>[...list].sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
const defaultMethod=(a,t)=>t==='xfer'?'bank':a?DEF_METHOD[a.kind]||'qr':'qr';
function methodsFor(a,t){
  if(t==='xfer') return['bank','atm','qr','cash'];if(!a) return['qr'];
  return{cash:['cash'],vcc:['qr'],credit:['card','online','qr'],prepaid:['online','card'],wallet:['qr','online']}[a.kind]||['qr','card','online','bank'];
}

/* ================= groups maths ================= */
function groupNet(g){
  const n={me:0};g.members.forEach(m=>n[m.id]=0);
  for(const b of S.gbills) if(b.group===g.id){n[b.payer]=(n[b.payer]||0)+b.total;for(const[k,v] of Object.entries(b.shares)) n[k]=(n[k]||0)-v}
  for(const x of S.gpays) if(x.group===g.id){n[x.from]=(n[x.from]||0)+x.amt;n[x.to]=(n[x.to]||0)-x.amt}
  return n;
}
function groupStats(g){
  const st={};['me',...g.members.map(m=>m.id)].forEach(id=>st[id]={paid:0,share:0,settled:0});
  for(const b of S.gbills) if(b.group===g.id){if(st[b.payer]) st[b.payer].paid+=b.total;for(const[k,v] of Object.entries(b.shares)) if(st[k]) st[k].share+=v}
  for(const x of S.gpays) if(x.group===g.id){if(st[x.from]) st[x.from].settled+=x.amt;if(st[x.to]) st[x.to].settled-=x.amt}
  return st;
}
/* fewest payments: split people into the most zero-sum subgroups, then settle inside each */
function settlePlan(net){
  const ids=Object.keys(net).filter(k=>net[k]!==0),n=ids.length;if(!n) return[];
  let parts=[ids];
  if(n<=15){
    const N=1<<n,sums=new Float64Array(N),dp=new Int8Array(N),from=new Int8Array(N);
    for(let m=1;m<N;m++){const lb=31-Math.clz32(m&-m);sums[m]=sums[m&(m-1)]+net[ids[lb]]}
    for(let m=1;m<N;m++){let best=-1,bi=0;for(let i=0;i<n;i++) if(m>>i&1){const v=dp[m^(1<<i)];if(v>best){best=v;bi=i}}dp[m]=best+(sums[m]===0?1:0);from[m]=bi}
    const order=[];let m=N-1;while(m){order.push(from[m]);m^=1<<from[m]}order.reverse();
    parts=[];let cur=[],s=0;for(const i of order){cur.push(ids[i]);s+=net[ids[i]];if(s===0){parts.push(cur);cur=[]}}if(cur.length) parts.push(cur);
  }
  const out=[];
  for(const part of parts){const bal=part.map(id=>({id,v:net[id]}));
    for(;;){bal.sort((a,b)=>a.v-b.v);const d=bal[0],c=bal[bal.length-1];if(!d||d.v>=0||c.v<=0) break;const x=Math.min(-d.v,c.v);out.push({from:d.id,to:c.id,amt:x});d.v+=x;c.v-=x}}
  return out;
}
function computeShares(total,members,payer,mode,custom){

function parseSms(text){
  const r={};
  const m=text.match(/(?:NPR|Rs\.?|रु\.?)\s*([\d,]+(?:\.\d{1,2})?)/i)||text.match(/\b(\d{1,3}(?:,\d{2,3})*\.\d{2})\b/);
  if(m) r.amt=m[1].replace(/,/g,'');
  const debit=/debit|debited|withdraw|paid|purchase|spent|\bdr\b/i.test(text),credit=/credit(?:ed)?\b|deposit|received|\bcr\b/i.test(text);
  r.t=credit&&!debit?'inc':'exp';if(/withdraw|\batm\b/i.test(text)) r.atm=true;
  const tail=text.match(/(?:a\/c|\bac\b|acct|account|card)\s*(?:no\.?)?\s*[:#]?\s*[xX*•.\d-]*?(\d{3,4})\b/i);
  if(tail){const d=tail[1];const a=S.accounts.find(x=>x.last4&&(d.endsWith(x.last4)||x.last4.endsWith(d)));if(a) r.acc=a.id}
  const mer=text.match(/\b(?:at|to)\s+([A-Za-z][\w &.'-]{2,40}?)(?=\s+(?:on|via|ref|dated|for|at)\b|[.,;]|$)/i);
  if(mer&&!/^(your|a\/c|account)/i.test(mer[1])) r.note=mer[1].trim();
  if(/fonepay|nepalpay|\bqr\b/i.test(text)) r.method='qr';else if(/\bpos\b|card/i.test(text)) r.method='card';
  return r;
}
function applyParsed(text){
  const r=parseSms(text);if(!r.amt){toast('No amount found in that text.');return false}
  if(r.atm){const cash=S.accounts.find(a=>a.kind==='cash');A=blankAdd('xfer');A.acc=r.acc||null;A.to=cash?.id||null;A.method='atm'}
  else{A=blankAdd(r.t);A.acc=r.acc||null;A.method=r.method||null;A.note=r.note||''}
  A.amt=r.amt.replace(/\.00$/,'');show('add');toast(r.acc?'Filled from SMS. Choose a category and save.':'Filled from SMS. Check the account, then save.');return true;
}

function donutSvg(parts,center,sub){
  const R=52,C=2*Math.PI*R,tot=parts.reduce((s,p)=>s+p.v,0)||1;let off=0;
  const arcs=parts.map(p=>{const len=p.v/tot*C,gap=parts.length>1?Math.min(2,len*.3):0;const el=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="18" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return el}).join('');
  return`<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Spending by category"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--soft)" stroke-width="18"/>${arcs}
  <text x="70" y="68" text-anchor="middle" style="font-size:17px;font-weight:650;fill:var(--ink)">${esc(center)}</text><text x="70" y="86" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${esc(sub)}</text></svg>`;
}
function dailySvg(p,list,dailyBudget){
  const n=diffDays(p.start,p.end)+1,vals=new Array(n).fill(0);list.forEach(x=>{const i=diffDays(p.start,x.date);if(i>=0&&i<n) vals[i]+=x.share});
  const max=Math.max(...vals,dailyBudget||0,1),W=n*10,Hh=90,td=diffDays(p.start,today());
  const bars=vals.map((v,i)=>{const h=v?Math.max(2,v/max*Hh):0;return`<rect x="${i*10+1.5}" y="${Hh-h}" width="7" height="${h}" rx="2" fill="${i===td?'var(--ink)':dailyBudget&&v>dailyBudget?'var(--danger)':'var(--accent)'}"/>`}).join('');
  const line=dailyBudget?`<line x1="0" x2="${W}" y1="${Hh-dailyBudget/max*Hh}" y2="${Hh-dailyBudget/max*Hh}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`:'';

      const mb={};sp.forEach(x=>{const k=x.method||'other';mb[k]=(mb[k]||0)+x.share});const mr=Object.entries(mb).sort((a,b)=>b[1]-a[1]);
      h+=`<div class="card"><h3>How you paid</h3><div class="stack">${mr.map(([k,v],i)=>`<i style="width:${v/spent*100}%;background:${PAL[i%PAL.length]}"></i>`).join('')}</div>
        ${mr.map(([k,v],i)=>`<div class="kv"><span style="display:flex;gap:8px;align-items:center"><i class="dot" style="background:${PAL[i%PAL.length]}"></i>${esc(METHODS[k]||'Other')}</span><span>${money(v)} <span class="muted small">${Math.round(v/spent*100)}%</span></span></div>`).join('')}</div>`;

function calendarHtml(p){
  const days=diffDays(p.start,p.end)+1,td=today(),it=items(p),per={},inc={},cnt={};
  it.forEach(x=>{if(x.t==='exp'&&x.share){per[x.date]=(per[x.date]||0)+x.share}if(x.t==='inc') inc[x.date]=(inc[x.date]||0)+x.amt;cnt[x.date]=(cnt[x.date]||0)+1});

      <span class="dn">${parseD(d).getDate()}</span><span class="da">${v?short(v):''}</span>${inc[d]?'<i class="inc"></i>':''}</button>`}
  const dayIt=it.filter(x=>x.date===H.day).sort((a,b)=>b.ts-a.ts),dsp=sum(dayIt.filter(x=>x.t==='exp'),x=>x.share);
  const spentDays=Object.keys(per).length,noSpend=Math.max(0,Math.min(days,diffDays(p.start,td<p.end?td:p.end)+1)-spentDays);
  return`<div class="card"><div class="cal">${['S','M','T','W','T','F','S'].map(w=>`<span class="cw">${w}</span>`).join('')}${cells}</div>
    <div class="key" style="justify-content:space-between;flex-wrap:wrap"><span><i class="dot" style="background:var(--accent)"></i>Darker means more spent</span>${daily?'<span><i class="dot" style="background:var(--danger)"></i>Over daily budget</span>':''}<span><i class="dot" style="background:#C2912E"></i>Income</span></div>

function filterCount(){const f=H.f;return (quickType()==='custom'?f.types.length:0)+(H.range!=='period'?1:0)+f.cats.length+f.accs.length+f.methods.length+(f.min!==''?1:0)+(f.max!==''?1:0)+(f.photo?1:0)+(f.split?1:0)}

const shownAmt=x=>x.t==='exp'?x.share||x.amt:x.amt;
function filteredItems(){
  const f=H.f,q=H.q.trim().toLowerCase();let it=items(rangeOf());
  if(f.types.length) it=it.filter(x=>f.types.includes(x.t));
  if(f.cats.length) it=it.filter(x=>f.cats.includes(x.cat));

  if(f.methods.length) it=it.filter(x=>f.methods.includes(x.method));
  const mn=toP(f.min),mx=toP(f.max);
  if(f.min!=='') it=it.filter(x=>Math.abs(shownAmt(x))>=mn);if(f.max!=='') it=it.filter(x=>Math.abs(shownAmt(x))<=mx);

actions.accOpen=d=>{
  const a=acc(d.id),bal=balances()[a.id],c=isCredit(a)?cardStatus(a):null;let body;
  if(c){body=`<p class="big">${money(c.owed)}</p><p class="muted">owed${c.limit?` of ${money(c.limit)} limit`:''}</p>${c.limit?bar(c.owed,c.limit,.7):''}<div class="card">
    ${c.limit?`<div class="kv"><span>Available</span><span class="${c.avail<0?'danger':''}">${money(c.avail)}</span></div>`:''}
    ${a.stmtDay?`<div class="kv"><span>To pay</span><span class="${c.overdue?'danger':''}">${c.remaining>0?money(c.remaining)+' by '+fmtD(c.due):'Nothing due'}</span></div>
      <div class="kv"><span>Spent since ${fmtD(c.last)}</span><span>${money(c.unbilled)}</span></div><div class="kv"><span>Next statement</span><span>${fmtD(c.next)}</span></div></div>
      <p class="help">Spend on this card today and you pay for it by ${fmtD(c.todayDue)}, ${c.todayDays} days away. The day after a statement gives the longest wait.</p>`:
      `</div><p class="help">Add the statement day and due period from your bank app to see what to pay and when.</p>`}
    ${a.kind==='vcc'?'<p class="help">Works on Fonepay QR only. If you scan a NepalPay QR, some banks charge your linked savings account instead, so log it there.</p>':''}`}
  else body=`<p class="big ${bal<0?'danger':''}">${money(bal)}</p><p class="muted">${esc(KINDS[a.kind])}${a.last4?', ending '+esc(a.last4):''}</p>`;
  sheet(`<h2>${esc(a.name)}</h2>${body}<div class="btns">${c&&c.owed>0?`<button class="btn primary grow" data-act="payCard" data-id="${a.id}">Pay this card</button>`:''}
  <button class="btn grow" data-act="reconcile" data-id="${a.id}">Fix balance</button><button class="btn grow" data-act="accTx" data-id="${a.id}">Entries</button><button class="btn grow" data-act="accEdit" data-id="${a.id}">Edit</button></div>`);
};
actions.payCard=d=>{const a=acc(d.id),c=cardStatus(a);A=blankAdd('xfer');A.to=a.id;A.amt=String((c.remaining>0?c.remaining:c.owed)/100);
  A.acc=(byUse(activeAccs().filter(x=>x.kind==='bank'||x.kind==='wallet'),usage('xfer','acc'))[0]||{}).id||null;A.method='bank';actions.close();show('add')};
actions.accTx=d=>{H.f={types:[],cats:[],accs:[d.id],methods:[],min:'',max:'',photo:false,split:false};H.mode='entries';H.q='';actions.close();show('history')};
actions.reconcile=d=>{const a=acc(d.id),b=balances()[a.id];
  sheet(`<h2>Fix balance</h2><p class="help">Enter ${isCredit(a)?'what you owe on':'what is in'} ${esc(a.name)} right now, as your bank app shows it. Khata adds a correction for the difference.</p>
  <label>${isCredit(a)?'Amount owed':'Balance'}<input id="f-amt" inputmode="decimal" value="${(isCredit(a)?-b:b)/100}"></label>
  <div class="btns"><button class="btn primary grow" data-act="reconcileSave" data-id="${a.id}">Save balance</button></div>`,p=>p.querySelector('input').select())};
actions.reconcileSave=d=>{const a=acc(d.id);let v=toP($('#f-amt').value);if(isCredit(a)) v=-v;const diff=v-balances()[a.id];
  if(diff){S.tx.push({id:uid(),t:'adj',amt:diff,acc:a.id,date:today(),ts:Date.now(),note:''});persist()}actions.close();render();toast(diff?`Corrected by ${money(diff,{sign:true,hide:false})}.`:'Already matches.')};
actions.accEdit=d=>{
  const isNew=!d.id,a=isNew?{kind:d.kind||'bank'}:acc(d.id),used=!isNew&&items().some(t=>t.acc===a.id||t.to===a.id);
  sheet(`<h2>${isNew?'Add account':'Edit account'}</h2>
  <label>Type<select id="f-kind">${Object.entries(KINDS).map(([k,v])=>opt(k,v,a.kind)).join('')}</select></label>
  <label>Name<input id="f-name" value="${esc(a.name||'')}" placeholder="Siddhartha savings, NIC Asia Visa…"></label>
  <label><span id="l-open"></span><input id="f-open" inputmode="decimal" value="${isNew?'':Math.abs(a.open||0)/100}" placeholder="0"><small id="h-open"></small></label>
  <label>Last 3 or 4 digits<input id="f-last4" inputmode="numeric" maxlength="4" value="${esc(a.last4||'')}" placeholder="Optional"><small>Matches bank SMS to this account. Never the full number.</small></label>
  <div id="credit-f"><label>Credit limit<input id="f-limit" inputmode="decimal" value="${a.limit?a.limit/100:''}"></label>
    <div class="grid2"><label>Statement day<input id="f-stmt" inputmode="numeric" value="${a.stmtDay||''}" placeholder="e.g. 5"></label><label>Days to pay after<input id="f-due" inputmode="numeric" value="${a.dueDays||''}" placeholder="e.g. 15"></label></div>
    <p class="help" id="h-credit"></p></div>
  <div class="btns">${isNew?'':a.archived?`<button class="btn" data-act="accArchive" data-id="${a.id}">Restore</button>`:used?`<button class="btn danger" data-act="accArchive" data-id="${a.id}">Archive</button>`:a.id!=='cash'?`<button class="btn danger" data-act="accDelete" data-id="${a.id}">Delete</button>`:''}
  <button class="btn primary grow" data-act="accSave" data-id="${a.id||''}">${isNew?'Add account':'Save changes'}</button></div>`,
  p=>{const k=p.querySelector('#f-kind'),sync=()=>{const cr=k.value==='credit'||k.value==='vcc';p.querySelector('#credit-f').hidden=!cr;
    p.querySelector('#l-open').textContent=cr?(isNew?'Amount owed now':'Amount owed before your first entry'):(isNew?'Balance now':'Starting balance before your first entry');
    p.querySelector('#h-open').textContent=isNew?'':'To match today\u2019s balance, use Fix balance instead.';
    p.querySelector('#h-credit').textContent=k.value==='vcc'?'Copy the limit, statement date and due date from your bank app\u2019s card section; banks set these differently. Fonepay credit cards work on Fonepay QR only, not POS machines or ATMs.'
      :'Copy the statement date and due date from your last statement. A physical card and a Fonepay credit card from the same bank are separate cards; add each one.'};
    k.addEventListener('change',sync);sync();if(isNew) p.querySelector('#f-name').focus()});
};
actions.accSave=d=>{
  const v=id=>$(id).value.trim(),name=v('#f-name');if(!name){toast('Give the account a name.');return}
  const kind=v('#f-kind'),cr=kind==='credit'||kind==='vcc',a=d.id?acc(d.id):{id:uid()},open=Math.abs(toP(v('#f-open'))),stmt=parseInt(v('#f-stmt'))||0,due=parseInt(v('#f-due'))||0;
  if(cr&&stmt&&(stmt<1||stmt>31)){toast('Statement day must be 1 to 31.');return}
  Object.assign(a,{name,kind,open:cr?-open:open,last4:v('#f-last4').replace(/\D/g,'')||undefined,limit:cr?toP(v('#f-limit'))||0:undefined,stmtDay:cr?stmt||undefined:undefined,dueDays:cr?due||undefined:undefined});
  if(!d.id) S.accounts.push(a);persist();actions.close();render();toast(d.id?'Saved changes.':`Added ${name}.`);
};
actions.accArchive=d=>{const a=acc(d.id);a.archived=!a.archived;persist();actions.close();render();toast(a.archived?'Archived. Its entries stay in History.':'Restored.')};
actions.accDelete=d=>{if(!confirm('Delete this account?')) return;S.accounts=S.accounts.filter(a=>a.id!==d.id);persist();actions.close();render()};

/* ================= PLAN ================= */
function renderPlan(){
  const p=period(0),sp=spends(p),by={};sp.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.share);
  const bud=S.cats.filter(c=>c.kind==='exp'&&c.budget&&!c.hidden),total=sum(bud,c=>c.budget),spentB=sum(bud,c=>by[c.id]||0);
  const outside=Object.entries(by).filter(([k])=>!bud.some(c=>c.id===k)).reduce((s,[,v])=>s+v,0);
  let h=`<div class="top"><h1>Plan</h1><div style="display:flex;align-items:center;gap:6px"><span class="muted small">${esc(p.label)}</span>${eyeBtn()}</div></div>`;
  h+=`<div class="card"><h3>Budgets</h3>`;
  if(!bud.length) h+=`<p class="muted">Set a monthly limit for the categories you want to watch. Khata then shows what's left and a daily amount on the Add screen.</p>`;
  else{const left=total-spentB,days=diffDays(today(),p.end)+1;
    h+=`<p class="lede" style="font-size:15px">${left>=0?`<b>${money(left)}</b> left, ${days} days to go.`:`<b class="danger">${money(-left)} over budget.</b>`}${outside?` <span class="muted">${money(outside)} spent outside budgets.</span>`:''}</p>`+
      [...bud].sort((a,b)=>(by[b.id]||0)/b.budget-(by[a.id]||0)/a.budget).map(c=>{const s=by[c.id]||0;
        return`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span style="display:flex;gap:10px;align-items:center"><span class="cic sm" style="--c:${c.color}">${icoSvg(catIcon(c))}</span>${esc(c.name)}</span><span class="${s>c.budget?'danger':''}">${money(s)} <span class="muted small">of ${money(c.budget)}</span></span></div>${bar(s,c.budget)}</div>`}).join('')}
  h+=`<div class="btns"><button class="btn grow" data-act="budgets">Set budgets</button><button class="btn grow" data-act="cats">Categories</button></div></div>`;
  h+=`<div class="card"><h3>Monthly bills</h3>`;
  if(!S.bills.length) h+=`<p class="muted">Rent, internet, school fees, EMIs. Add them once and Khata reminds you three days before.</p>`;
  h+=[...S.bills].sort((a,b)=>billDue(a,p).localeCompare(billDue(b,p))).map(b=>{const paid=billPaid(b,p),n=diffDays(today(),billDue(b,p));
    return`<div class="row"><button class="l" data-act="billEdit" data-id="${b.id}"><div><p class="t">${esc(b.name)}</p><p class="sub">${money(b.amt)} on the ${ord(b.day)}${acc(b.acc)?', '+esc(acc(b.acc).name):''}</p></div></button>
    <div class="r">${paid?'<span class="pill good">Paid</span>':`<button class="btn" style="height:36px;padding:0 12px" data-act="billPay" data-id="${b.id}">Mark paid</button><p class="sub ${n<0?'danger':n<=3?'warn':''}">Due ${inDays(n)}</p>`}</div></div>`}).join('');
  h+=`<div class="btns"><button class="btn grow" data-act="billEdit">Add bill</button></div></div>`;
  h+=`<div class="card"><h3>Shortcuts</h3><p class="muted small">One-tap entries for things you pay often, like tea or bus fare. The first four show on the Add screen.</p>`+
    S.quick.map(q=>`<button class="row" data-act="quickEdit" data-id="${q.id}"><div class="l"><i class="dot" style="background:${catColor(q.cat)}"></i><div><p class="t">${esc(q.label)}</p><p class="sub">${esc(cat(q.cat)?.name||'')}, ${esc(acc(q.acc)?.name||'')}</p></div></div><div class="r">${money(q.amt)}</div></button>`).join('')+
    `<div class="btns"><button class="btn grow" data-act="quickEdit">Add shortcut</button></div></div>`;
  $('#v-plan').innerHTML=h;
}
actions.budgets=()=>{const cats=S.cats.filter(c=>c.kind==='exp'&&!c.hidden);
  sheet(`<h2>Monthly budgets</h2><p class="help">Leave blank for no budget.</p><div class="grid2">${cats.map(c=>`<label>${esc(c.name)}<input inputmode="decimal" data-bud="${c.id}" value="${c.budget?c.budget/100:''}" placeholder="–"></label>`).join('')}</div>
  <div class="btns"><button class="btn primary grow" data-act="budgetsSave">Save budgets</button></div>`)};
actions.budgetsSave=()=>{document.querySelectorAll('[data-bud]').forEach(i=>cat(i.dataset.bud).budget=toP(i.value));persist();actions.close();render();toast('Saved budgets.')};
actions.cats=()=>{sheet(`<h2>Categories</h2><p class="help">Tap an icon to change it. Hidden categories keep their past entries.</p>
  ${['exp','inc'].map(k=>`<p class="lbl">${k==='exp'?'Spending':'Income'}</p>`+S.cats.filter(c=>c.kind===k).map(c=>`<div class="catrow"><button class="cic" style="--c:${c.color}" data-act="catIcon" data-id="${c.id}" aria-label="Change icon">${icoSvg(catIcon(c))}</button><input data-cn="${c.id}" value="${esc(c.name)}" aria-label="Category name"><label class="switch" title="Show"><input type="checkbox" data-ch="${c.id}" ${c.hidden?'':'checked'} aria-label="Show ${esc(c.name)}"><i></i></label></div>`).join('')).join('')}
  <p class="lbl">New category</p><div class="grid2"><label>Name<input id="f-newcat"></label><label>Type<select id="f-newkind">${opt('exp','Expense','exp')}${opt('inc','Income')}</select></label></div>
  <div class="btns"><button class="btn primary grow" data-act="catsSave">Save categories</button></div>`)};
actions.catIcon=d=>{const keep={};document.querySelectorAll('[data-cn]').forEach(i=>keep[i.dataset.cn]=i.value);document.querySelectorAll('[data-ch]').forEach(i=>keep['h'+i.dataset.ch]=i.checked);
  const c=cat(d.id);sheet(`<h2>Icon for ${esc(c.name)}</h2><div class="icongrid">${Object.keys(CAT_ICONS).map(k=>`<button class="cic${(c.icon||c.id)===k?' sel':''}" style="--c:${c.color}" data-act="catIconSet" data-k="${k}">${icoSvg(CAT_ICONS[k])}</button>`).join('')}</div>
  <p class="lbl">Colour</p><div class="icongrid">${PAL.map(p=>`<button class="swatch${c.color===p?' sel':''}" style="background:${p}" data-act="catColorSet" data-k="${p}" aria-label="Colour ${p}"></button>`).join('')}</div>
  <div class="btns"><button class="btn primary grow" data-act="cats">Done</button></div>`);
  actions.catIconSet=x=>{c.icon=x.k;persist();actions.catIcon(d)};actions.catColorSet=x=>{c.color=x.k;persist();actions.catIcon(d)};
  const back=actions.cats;actions.cats=()=>{actions.cats=back;back();document.querySelectorAll('[data-cn]').forEach(i=>{if(keep[i.dataset.cn]!=null) i.value=keep[i.dataset.cn]});document.querySelectorAll('[data-ch]').forEach(i=>{if(keep['h'+i.dataset.ch]!=null) i.checked=keep['h'+i.dataset.ch]})}};
actions.catsSave=()=>{document.querySelectorAll('[data-cn]').forEach(i=>{const v=i.value.trim();if(v) cat(i.dataset.cn).name=v});
  document.querySelectorAll('[data-ch]').forEach(i=>cat(i.dataset.ch).hidden=!i.checked);
  const n=$('#f-newcat').value.trim();if(n) S.cats.push({id:uid(),name:n,kind:$('#f-newkind').value,budget:0,color:PAL[S.cats.length%PAL.length]});
  persist();actions.close();render();toast('Saved categories.')};
actions.billEdit=d=>{const b=d.id?S.bills.find(x=>x.id===d.id):{day:1};
  sheet(`<h2>${d.id?'Edit bill':'Add bill'}</h2><label>Name<input id="f-name" value="${esc(b.name||'')}" placeholder="Rent, WorldLink, school fee"></label>
  <div class="grid2"><label>Amount<input id="f-amt" inputmode="decimal" value="${b.amt?b.amt/100:''}"></label><label>Day of month<input id="f-day" inputmode="numeric" value="${b.day}"></label></div>
  <div class="grid2"><label>Category<select id="f-cat">${S.cats.filter(c=>c.kind==='exp'&&!c.hidden).map(c=>opt(c.id,c.name,b.cat||'util')).join('')}</select></label><label>Paid from<select id="f-acc">${accOpts(b.acc||S.set.lastAcc.exp)}</select></label></div>
  <div class="btns">${d.id?`<button class="btn danger" data-act="billDel" data-id="${d.id}">Delete</button>`:''}<button class="btn primary grow" data-act="billSave" data-id="${d.id||''}">${d.id?'Save changes':'Add bill'}</button></div>`)};
actions.billSave=d=>{const name=$('#f-name').value.trim(),amt=toP($('#f-amt').value),day=Math.min(31,Math.max(1,parseInt($('#f-day').value)||1));
  if(!name||!amt){toast('Add a name and amount.');return}const b=d.id?S.bills.find(x=>x.id===d.id):{id:uid()};
  Object.assign(b,{name,amt,day,cat:$('#f-cat').value,acc:$('#f-acc').value});if(!d.id) S.bills.push(b);persist();actions.close();render()};
actions.billDel=d=>{S.bills=S.bills.filter(b=>b.id!==d.id);persist();actions.close();render()};
actions.billPay=d=>{const b=S.bills.find(x=>x.id===d.id),a=acc(b.acc)||activeAccs()[0];
  const t={id:uid(),t:'exp',amt:b.amt,acc:a.id,cat:b.cat,date:today(),ts:Date.now(),method:defaultMethod(a,'exp'),note:b.name,bill:b.id};
  S.tx.push(t);persist();render();toast(`Logged ${b.name} as paid.`,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);persist();render()})};
actions.quickEdit=d=>{const q=d.id?S.quick.find(x=>x.id===d.id):{};
  sheet(`<h2>${d.id?'Edit shortcut':'Add shortcut'}</h2><div class="grid2"><label>Label<input id="f-name" value="${esc(q.label||'')}" placeholder="Tea, bus, lunch"></label><label>Amount<input id="f-amt" inputmode="decimal" value="${q.amt?q.amt/100:''}"></label></div>
  <div class="grid2"><label>Category<select id="f-cat">${S.cats.filter(c=>c.kind==='exp'&&!c.hidden).map(c=>opt(c.id,c.name,q.cat)).join('')}</select></label><label>Paid from<select id="f-acc">${accOpts(q.acc||S.set.lastAcc.exp)}</select></label></div>
  <div class="btns">${d.id?`<button class="btn danger" data-act="quickDel" data-id="${d.id}">Delete</button>`:''}<button class="btn primary grow" data-act="quickSave" data-id="${d.id||''}">${d.id?'Save changes':'Add shortcut'}</button></div>`)};
actions.quickSave=d=>{const label=$('#f-name').value.trim(),amt=toP($('#f-amt').value);if(!label||!amt){toast('Add a label and amount.');return}
  const q=d.id?S.quick.find(x=>x.id===d.id):{id:uid()};Object.assign(q,{label,amt,cat:$('#f-cat').value,acc:$('#f-acc').value});q.method=defaultMethod(acc(q.acc),'exp');
  if(!d.id) S.quick.push(q);persist();actions.close();render()};
actions.quickDel=d=>{S.quick=S.quick.filter(q=>q.id!==d.id);persist();actions.close();render()};

/* ================= SETTINGS / PRIVACY / BACKUP ================= */
actions.settings=()=>{actions.close();show('settings')};
function renderSettings(){
  const lb=S.set.lastBackup,ago=lb?-diffDays(today(),lb):null,stale=ago==null||ago>14;
  const n=S.tx.length+S.gbills.length+S.vlogs.length;
  $('#v-settings').innerHTML=`<div class="top"><h1>Settings</h1></div>
  <div class="card"><h3>Backup</h3>
    <p class="${stale?'warn':'muted'} small">${lb?`Last backup ${fmtD(lb)}, ${ago===0?'today':ago+' day'+(ago===1?'':'s')+' ago'}.`:'No backup yet.'} If this phone is lost or its browser data is cleared, a backup file is the only way back.</p>
    <div class="btns"><button class="btn primary grow" data-act="exportXlsx">Excel file</button><button class="btn grow" data-act="exportBackup">${meta.locked?'Encrypted file':'Backup file'}</button></div>
    <p class="help">Excel has charts and your spending, and can restore Khata. It never includes bank balances${S.set.excelIncome?'':' or income'}, or bill photos, since anyone who opens it can read it. The backup file includes photos${meta.locked?' and needs your PIN':''}.</p>
    <div class="srow" style="border:0"><span>Include income in Excel<small>Off keeps your salary and other income out of the Excel file.</small></span><label class="switch"><input type="checkbox" id="f-xinc" ${S.set.excelIncome?'checked':''} aria-label="Include income in Excel"><i></i></label></div>
    <div class="btns"><button class="btn grow" data-act="importBackup">Restore from a file</button></div></div>
  <div class="card"><h3>Privacy</h3>
    <div class="srow"><span>PIN lock<small>${meta.locked?'On. Your data is encrypted.':'Off'}</small></span>${meta.locked?'<button class="btn" data-act="lockNow">Lock now</button>':'<button class="btn primary" data-act="lockSet">Set a PIN</button>'}</div>
    ${meta.locked?`<div class="srow"><span>Lock again after leaving</span><select id="f-autolock" class="ssel">${[[0,'Immediately'],[1,'1 minute'],[5,'5 minutes'],[15,'15 minutes']].map(([v,l])=>opt(String(v),l,String(S.set.autolock))).join('')}</select></div>
      <div class="srow"><span>Unlock with fingerprint<small>${meta.bio?'On. Your PIN still works too.':'Open Khata with your fingerprint or face instead of typing the PIN.'}</small></span><label class="switch"><input type="checkbox" id="f-bioun" ${meta.bio?'checked':''} aria-label="Unlock with fingerprint"><i></i></label></div>
      <div class="btns"><button class="btn grow" data-act="lockSet">Change PIN</button><button class="btn danger grow" data-act="lockOff">Turn lock off</button></div>`:''}
    <div class="srow"><span>Always hide amounts<small>Hidden every time you open or come back to the app. Tap the eye to show them.</small></span><label class="switch"><input type="checkbox" id="f-hideopen" ${S.set.hideOnOpen?'checked':''} aria-label="Always hide amounts"><i></i></label></div>
    <div class="srow"><span>To show amounts, ask for<small>${guardSummary()}</small></span><select id="f-guard" class="ssel">${[['off','Nothing'],['pin','PIN'],['bio','Fingerprint or face']].map(([v,l])=>opt(v,l,guard().mode)).join('')}</select></div>
    <p class="help">Your entries stay on this phone. Khata only goes online to download the bill reader once, and to send a bill photo to Claude if you turn that on.</p></div>
  <div id="bill-set" class="card"><h3>Reading bills</h3><p class="muted small">Checking…</p></div>
  <div class="card"><h3>Month</h3><div class="srow" style="border:0"><span>Month starts on<small>Use your salary day to budget payday to payday.</small></span><select id="f-start" class="ssel">${Array.from({length:28},(_,i)=>opt(String(i+1),ord(i+1),String(S.set.startDay))).join('')}</select></div></div>
  <div class="card"><h3>Data</h3><div class="srow"><span>Entries on this phone</span><span>${nf.format(n)}</span></div><div class="srow" style="border:0"><span>Storage used</span><span id="f-store">…</span></div>
    <div class="btns"><button class="btn danger grow" data-act="wipe">Erase everything</button></div></div>
  <p class="help" style="text-align:center">Khata, version ${APP_VERSION}</p>`;
  const save=()=>{persist();};
  $('#f-hideopen').addEventListener('change',e=>{S.set.hideOnOpen=e.target.checked;if(e.target.checked) S.set.hide=true;save();render()});
  $('#f-guard').addEventListener('change',e=>setGuardMode(e.target.value));
  $('#f-xinc').addEventListener('change',e=>{S.set.excelIncome=e.target.checked;save()});
  $('#f-start').addEventListener('change',e=>{S.set.startDay=+e.target.value;save();toast('Month now starts on the '+ord(+e.target.value)+'.')});
  if($('#f-autolock')) $('#f-autolock').addEventListener('change',e=>{S.set.autolock=+e.target.value;save()});
  if($('#f-bioun')) $('#f-bioun').addEventListener('change',e=>{e.target.checked?bioUnlockSetup():bioUnlockOff()});
  if(navigator.storage&&navigator.storage.estimate) navigator.storage.estimate().then(e=>{const el=$('#f-store');if(el) el.textContent=(e.usage/1048576).toFixed(1)+' MB'}).catch(()=>{});

function ensureVehCat(){let c=cat('vehicle');if(!c){c={id:'vehicle',name:'Vehicle service',kind:'exp',budget:0,color:'#5C6B7A'};S.cats.push(c)}return c.id}
function vlogsOf(id){return S.vlogs.filter(l=>l.veh===id).sort((a,b)=>a.date.localeCompare(b.date)||(a.odo??0)-(b.odo??0)||a.ts-b.ts)}
function vehStats(v){
  const logs=vlogsOf(v.id),fuels=logs.filter(l=>l.type==='fuel'&&l.odo!=null);
  const fills=fuels.map((f,i)=>{const p=fuels[i-1],km=p?f.odo-p.odo:null;return{...f,km,kml:km>0&&f.litres?km/f.litres:null}});
  const after=fills.filter((f,i)=>i>0&&f.km>0);
  const km=sum(after,f=>f.km),lit=sum(after,f=>f.litres||0),fcost=sum(after,f=>f.total||0);
  const odos=logs.filter(l=>l.odo!=null),cur=odos.length?Math.max(...odos.map(l=>l.odo)):null;
  const fuelSpent=sum(logs.filter(l=>l.type==='fuel'),l=>l.total||0),svcSpent=sum(logs.filter(l=>l.type!=='fuel'),l=>l.total||0);
  const svc=logs.filter(l=>l.type==='service'),last=svc[svc.length-1];
  const first=odos[0],days=first?Math.max(1,diffDays(first.date,today())):0,kmMonth=first&&cur!=null&&days>=30?(cur-first.odo)/days*30.44:null;
  let next=null;
  if(last&&(v.svcKm||v.svcMonths)){next={};
    if(v.svcKm&&last.odo!=null){next.odo=last.odo+v.svcKm;next.kmLeft=cur!=null?next.odo-cur:null}
    if(v.svcMonths){const d=parseD(last.date);d.setMonth(d.getMonth()+v.svcMonths);next.date=ds(d);next.daysLeft=diffDays(today(),next.date)}
    if(next.kmLeft==null&&v.svcKm&&kmMonth){}
  }
  return{logs,fills,km,lit,kml:lit?km/lit:null,costKm:km?fcost/km:null,cur,fuelSpent,svcSpent,last,next,kmMonth};
}
const km=n=>n==null?'–':nf.format(Math.round(n))+' km';
function serviceLine(v,st){
  if(!st.last) return{cls:'',text:'No service logged yet'};
  if(!st.next) return{cls:'',text:`Last service ${fmtD(st.last.date)}${st.last.odo!=null?' at '+km(st.last.odo):''}`};
  const parts=[];let cls='good';
  if(st.next.kmLeft!=null){parts.push(st.next.kmLeft>=0?`${km(st.next.kmLeft)} left`:`${km(-st.next.kmLeft)} overdue`);if(st.next.kmLeft<0) cls='danger';else if(st.next.kmLeft<(v.svcKm||0)*.15&&cls!=='danger') cls='warn'}
  if(st.next.daysLeft!=null){parts.push(st.next.daysLeft>=0?`by ${fmtD(st.next.date)}`:`was due ${fmtD(st.next.date)}`);if(st.next.daysLeft<0) cls='danger';else if(st.next.daysLeft<14&&cls==='good') cls='warn'}
  return{cls,text:'Next service: '+parts.join(', ')};
}

  let logs=[...st.logs].reverse();if(GA.type!=='all') logs=logs.filter(l=>l.type===GA.type);

  $('#v-garage').innerHTML=h;const gs=$('#ga-sort');if(gs) gs.addEventListener('change',e=>{GA.sort=e.target.value;const y=$('#main').scrollTop;renderGarage();$('#main').scrollTop=y});

actions.vlSave=()=>{

function linkVlogTx(x,accId){
  let tx=x.tx&&S.tx.find(t=>t.id===x.tx);const v=vehicle(x.veh);
  if(accId&&x.total){
    const note=x.type==='fuel'?`${v.name} fuel${x.litres?', '+(+(+x.litres).toFixed(2))+' L':''}`:`${v.name} ${x.type==='service'?'service':''} ${x.note||''}`.replace(/\s+/g,' ').trim();
    if(!tx){tx={id:uid(),t:'exp',ts:Date.now(),vlog:x.id};S.tx.push(tx);x.tx=tx.id}
    Object.assign(tx,{amt:x.total,acc:accId,cat:x.type==='fuel'?'fuel':ensureVehCat(),date:x.date,method:defaultMethod(acc(accId),'exp'),note,photos:(x.photos||[]).slice()});
    S.set.lastAcc.exp=accId;
  }else if(tx){S.tx=S.tx.filter(t=>t!==tx);delete x.tx}

actions.vlDel=()=>{const x=S.vlogs.find(y=>y.id===VL.l.id);if(!x) return;const tx=x.tx&&S.tx.find(t=>t.id===x.tx);

actions.importDiarium=()=>{const i=document.createElement('input');i.type='file';i.accept='.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  i.onchange=async()=>{const f=i.files[0];if(!f) return;try{previewDiarium(await parseDiarium(await f.arrayBuffer()))}catch(e){toast('Couldn\u2019t read that file. Export from Diarium as Word (.docx).')}};i.click()};
async function parseDiarium(buf){
  const z=await KhataXlsx.unzip(buf),xml=await z.text('word/document.xml');if(!xml) throw new Error('no document');
  const P=s=>new DOMParser().parseFromString(s,'application/xml'),doc=P(xml),rels={},rx=await z.text('word/_rels/document.xml.rels');
  if(rx) for(const r of P(rx).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')]=r.getAttribute('Target');
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',DML='http://schemas.openxmlformats.org/drawingml/2006/main';
  const DATE=/^(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+([A-Za-z]+)\s+(\d{1,2}),\s+(\d{4})$/;
  const ents=[];let cur=null;
  for(const p of doc.getElementsByTagNameNS(W,'p')){

  const total=n(j.total);
  return{total,sub:n(j.subtotal),svc:n(j.service_charge),vat:n(j.vat),disc:n(j.discount),items,merchant:String(j.merchant||'').slice(0,40),date:/^\d{4}-\d{2}-\d{2}$/.test(j.date||'')?j.date:null,cands:[total,n(j.subtotal)].filter(v=>v>0),source:'ai'};
}
/* ---- UI: read the photo just attached ---- */
async function billBlob(){if(A.lastOriginal) return A.lastOriginal;const id=A.photos[A.photos.length-1];if(!id) return null;const b=await photoBytes(id);return b?new Blob([b],{type:'image/jpeg'}):null}
function billStatus(msg,pct){sheet(`<h2>Reading the bill</h2><p class="help">${esc(msg)}</p><div class="bar-t" style="margin-top:14px"><i style="width:${Math.round((pct||0)*100)}%"></i></div>`)}
actions.readBill=async d=>{
  const blob=await billBlob();if(!blob){toast('Add a bill photo first.');return}
  const useAI=d.how==='ai';
  try{
    let r;
    if(useAI){billStatus('Sending the photo to Claude…',.3);r=await readBillAI(blob)}
    else{
      const first=!(await ocrReady());
      billStatus(first?'Getting the bill reader ready. The first time downloads about 7 MB, then it works offline.':'Reading on your phone…',.05);
      const w=await loadOCR((s,p)=>{const lbl=/recogniz/.test(s)?'Reading the text…':/load|initializ/.test(s)?(first?'Downloading the bill reader (first time only)…':'Starting the bill reader…'):'Working…';billStatus(lbl,p)});
      const img=await prepImage(blob,2000,true);const out=await w.recognize(img);r=parseBillText(out.data.text);r.raw=out.data.text;
    }
    BILL=r;showBillResult();
  }catch(e){actions.close();if(!useAI){OCRW=null;toast(await ocrProblem(e))}else toast(e.message||'Couldn\u2019t read that bill.')}
};
function showBillResult(){
  const r=BILL,ai=aiSet(),f=v=>v==null?'–':money(Math.round(v*100),{hide:false});
  const none=!r.cands.length;
  sheet(`<h2>From the bill</h2>
  ${none?'<p class="help">No amounts found. Try a sharper, straight-on photo with good light'+(ai.on&&ai.key&&r.source!=='ai'?', or read it with AI':'')+'.</p>':
  `<p class="lbl">Total ${r.source==='phone'?'(tap the right one)':''}</p><div class="opts">${r.cands.map((v,i)=>`<button class="opt${i===0?' on':''}" data-act="billUse" data-v="${v}">${f(v)}</button>`).join('')}</div>`}
  ${r.svc||r.vat||r.disc?`<div class="card" style="margin-top:12px">${r.sub?`<div class="kv"><span>Subtotal</span><span>${f(r.sub)}</span></div>`:''}${r.svc?`<div class="kv"><span>Service charge</span><span>${f(r.svc)}</span></div>`:''}${r.vat?`<div class="kv"><span>VAT</span><span>${f(r.vat)}</span></div>`:''}${r.disc?`<div class="kv"><span>Discount</span><span>−${f(r.disc)}</span></div>`:''}</div>`:''}
  ${r.merchant?`<p class="lbl">Shop</p><div class="opts"><button class="opt" data-act="billNote">${esc(r.merchant)}</button></div>`:''}
  <p class="help">${r.items.length?`${r.items.length} items found. `:''}${r.source==='phone'?'Read on your phone. Check the numbers before saving.':'Read by Claude. Check the numbers before saving.'}</p>
  <div class="btns">${r.items.length||!none?`<button class="btn grow" data-act="billSplit">Split by items</button>`:''}${r.source==='phone'&&ai.on&&ai.key?'<button class="btn grow" data-act="readBill" data-how="ai">Read with AI</button>':''}
  ${!none?`<button class="btn primary grow" data-act="billUse" data-v="${r.cands[0]}">Use ${f(r.cands[0])}</button>`:''}</div>`);
}
actions.billUse=d=>{A.amt=String(Math.round(+d.v*100)/100);if(!A.note&&BILL&&BILL.merchant) A.note=BILL.merchant;if(BILL&&BILL.date&&BILL.date<=today()) A.date=BILL.date;actions.close();updateAdd();toast('Amount filled from the bill. Check it, then save.')};

/* ---- split by items ---- */
let SPL=null;
actions.billSplit=()=>{
  const gs=S.groups.filter(g=>!g.archived);
  if(!gs.length){actions.groupEdit({then:'billsplit'});return}
  const g=A.split?grp(A.split.group):grp(S.set.lastGroup)&&!grp(S.set.lastGroup).archived?grp(S.set.lastGroup):gs[0];
  const people=['me',...g.members.map(m=>m.id)];
  const r=BILL||{items:[],cands:[]};
  SPL={sub:r.sub??null,group:g.id,payer:A.split&&A.split.group===g.id?A.split.payer:'me',total:r.total??r.cands[0]??null,
    items:(r.items.length?r.items:[{name:'Item',qty:1,price:0}]).map(i=>({name:i.name,price:i.price,who:people.slice()}))};
  drawSplitItems();
};
function splitItemsMath(){
  const g=grp(SPL.group),people=['me',...g.members.map(m=>m.id)],per={};people.forEach(p=>per[p]=0);
  let itemsTotal=0;
  for(const it of SPL.items){const pr=+it.price||0;itemsTotal+=pr;if(!it.who.length) continue;it.who.forEach(p=>per[p]+=pr/it.who.length)}
  const grand=SPL.total!=null&&SPL.total!==''?+SPL.total:itemsTotal;
  const factor=itemsTotal>0?grand/itemsTotal:0,share={};
  let sumP=0;people.forEach(p=>{share[p]=Math.round(per[p]*factor*100);sumP+=share[p]});
  const gp=Math.round(grand*100),diff=gp-sumP;if(diff&&itemsTotal>0){const tgt=share[SPL.payer]>0?SPL.payer:people.find(p=>share[p]>0);if(tgt) share[tgt]+=diff}
  const unassigned=SPL.items.filter(i=>!i.who.length&&+i.price>0).length;
  return{people,share,itemsTotal,grand,extra:grand-itemsTotal,unassigned};
}
function drawSplitItems(keepScroll){
  const g=grp(SPL.group),m=splitItemsMath(),y=keepScroll?($('.panel')?.scrollTop||0):0;
  sheet(`<h2>Split by items</h2>
  <p class="lbl">Group</p><div class="opts">${S.groups.filter(x=>!x.archived).map(x=>`<button class="opt${x.id===g.id?' on':''}" data-act="siGroup" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>
  <p class="lbl">Who paid?</p><div class="opts">${m.people.map(id=>`<button class="opt${SPL.payer===id?' on':''}" data-act="siPayer" data-id="${id}">${esc(who(g,id))}</button>`).join('')}</div>
  <p class="help">Tap names under each item to choose who had it. Shared items are split evenly between the people ticked.</p>
  ${SPL.items.map((it,i)=>`<div class="card siitem"><div style="display:flex;gap:8px"><input class="siname" data-i="${i}" value="${esc(it.name)}" aria-label="Item name"><input class="siprice" data-i="${i}" inputmode="decimal" value="${it.price||''}" placeholder="Rs" aria-label="Item price"><button class="x2" data-act="siDel" data-i="${i}" aria-label="Remove item">✕</button></div>
    <div class="opts" style="margin-top:8px">${m.people.map(id=>`<button class="opt sm${it.who.includes(id)?' on':''}" data-act="siWho" data-i="${i}" data-id="${id}">${esc(who(g,id))}</button>`).join('')}</div></div>`).join('')}
  <button class="link" data-act="siAdd">Add an item</button>
  <label>Bill total (with tax and service)<input id="si-total" inputmode="decimal" value="${SPL.total??''}" placeholder="${nf.format(m.itemsTotal)}"><small>Items add up to ${money(Math.round(m.itemsTotal*100),{hide:false})}${Math.abs(m.extra)>=0.01?`; the ${m.extra>0?'extra':'difference'} ${money(Math.round(Math.abs(m.extra)*100),{hide:false})} (tax, service, discount) is shared in proportion to what each person had`:''}.</small></label>
  <div class="card" style="margin-top:12px"><h3>Each person pays</h3>${m.people.map(id=>`<div class="kv"><span>${esc(who(g,id))}</span><span>${money(m.share[id],{hide:false})}</span></div>`).join('')}</div>
  ${SPL.sub&&Math.abs(SPL.sub-m.itemsTotal)>=1?`<p class="help warn">Items add up to ${money(Math.round(m.itemsTotal*100),{hide:false})} but the bill's subtotal is ${money(Math.round(SPL.sub*100),{hide:false})}. Check for a misread price or a missing item.</p>`:''}
  ${m.unassigned?`<p class="help warn">${m.unassigned} item${m.unassigned>1?'s have':' has'} nobody ticked and won't be counted.</p>`:''}
  <div class="btns"><button class="btn primary grow" data-act="siDone">Use this split</button></div>`,
  p=>{p.querySelectorAll('.siname').forEach(e=>e.addEventListener('input',()=>SPL.items[e.dataset.i].name=e.value));
      p.querySelectorAll('.siprice').forEach(e=>e.addEventListener('change',()=>{SPL.items[e.dataset.i].price=parseFloat(e.value.replace(/,/g,''))||0;drawSplitItems(true)}));
      p.querySelector('#si-total').addEventListener('change',e=>{const v=e.target.value.replace(/,/g,'').trim();SPL.total=v===''?null:parseFloat(v)||null;drawSplitItems(true)});
      if(y) p.scrollTop=y});
}
actions.siGroup=d=>{const g=grp(d.id),people=['me',...g.members.map(m=>m.id)];SPL.group=g.id;SPL.payer='me';SPL.items.forEach(i=>i.who=people.slice());drawSplitItems(true)};
actions.siPayer=d=>{SPL.payer=d.id;drawSplitItems(true)};
actions.siWho=d=>{const it=SPL.items[d.i],k=it.who.indexOf(d.id);k>=0?it.who.splice(k,1):it.who.push(d.id);drawSplitItems(true)};
actions.siDel=d=>{SPL.items.splice(+d.i,1);if(!SPL.items.length) SPL.items.push({name:'Item',price:0,who:['me']});drawSplitItems(true)};
actions.siAdd=()=>{const g=grp(SPL.group);SPL.items.push({name:'',price:0,who:['me',...g.members.map(m=>m.id)]});drawSplitItems(true);setTimeout(()=>{const p=$('.panel');p.scrollTop=p.scrollHeight;const n=[...document.querySelectorAll('.siname')].pop();n&&n.focus()},50)};
actions.siDone=()=>{
  const m=splitItemsMath();
  if(!(m.grand>0)){toast('Add item prices or a bill total first.');return}
  const members=m.people.filter(p=>m.share[p]>0);if(!members.length){toast('Tick at least one person.');return}
  const custom={};members.forEach(p=>custom[p]=String(m.share[p]/100));
  A.t='exp';A.amt=String(Math.round(m.grand*100)/100);A.split={group:SPL.group,payer:SPL.payer,members,mode:'exact',custom,items:SPL.items.map(i=>({name:i.name,price:+i.price||0,who:i.who.slice()}))};
  if(!A.cat) A.cat=cat('food')?'food':null;if(!A.note&&BILL&&BILL.merchant) A.note=BILL.merchant;
  S.set.lastGroup=SPL.group;actions.close();show('add');toast('Split ready. Check the category, then save.');
};
/* ---- settings card ---- */
async function billSettingsHtml(){

  return`<div id="bill-set" class="card"><h3>Reading bills</h3>
  <div class="srow"><span>On your phone<small>${ready?'Ready, works offline':'Downloads about 7 MB the first time'}</small></span>${ready?'<span class="good">Ready</span>':'<button class="btn" data-act="ocrDownload">Download</button>'}</div>
  <div class="srow"><span>Also offer AI reading<small>More accurate. Sends the photo to Claude and uses your API credit.</small></span><label class="switch"><input type="checkbox" id="f-aion" ${ai.on?'checked':''} aria-label="Offer AI reading"><i></i></label></div>
